name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  ContinuousIntegrationBuild: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory ./TestResults

      # Dogfooding: the samples are fixtures, but running the real CLI over them is what proves the
      # published exit codes still mean what the documentation says they mean.
      - name: Validate the sample skills with the built CLI
        shell: bash
        run: |
          set -euo pipefail
          run() { dotnet run --project src/SkillForge.Cli --no-build --configuration Release -- "$@"; }

          run validate ./samples/valid-skill --strict --no-color
          run validate ./samples/dotnet-api-review --strict --no-color

          # This one must fail with exit code 1; anything else is a regression.
          if run validate ./samples/broken-references --no-color; then
            echo "Expected broken-references to fail validation"
            exit 1
          fi

          run inspect ./samples/dotnet-api-review --no-color > /dev/null
          run pack ./samples/valid-skill --output ./artifacts/packages --no-color

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults
          if-no-files-found: ignore
